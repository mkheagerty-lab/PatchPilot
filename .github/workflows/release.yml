name: Release

# Kept separate from ci.yml (which stays PR/main-only): this workflow needs
# `permissions: contents: write` to publish a GitHub Release, and only runs
# on a version tag pushed via `pnpm version:bump <x.y.z>` (see
# scripts/bump-version.mjs) — never on every push to main.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: verify, tag-match check, publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The updater sidecar (infra/updater/run.sh) does `git checkout
      # "$TAG"` straight from `package.json`'s recorded target_version — if
      # the pushed tag and the version actually built here ever disagree,
      # PatchPilot > Settings > Updates would show one version but the
      # updater would check out another. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Check whether a changelog section was found
        id: notes
        run: |
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
