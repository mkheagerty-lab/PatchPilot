# Serves the built SPA. Caddy terminates TLS and proxies /api + /auth to the
# API before requests ever reach here, so nginx only handles static assets and
# the SPA history fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
